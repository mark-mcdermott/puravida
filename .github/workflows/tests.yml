name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * *"

jobs:
  verify:
    uses: mark-mcdermott/mm-claude-starter/.github/workflows/bash-verify.yml@main
    with:
      test-command: bats test/
      install-bats: true
      os: '["ubuntu-latest", "macos-latest"]'
